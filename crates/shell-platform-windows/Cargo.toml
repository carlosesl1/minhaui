[package]
name = "shell-platform-windows"
autotests = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
native-validation = []

[dependencies]
shell-config = { path = "../shell-config", version = "0.1.0" }
shell-core = { path = "../shell-core", version = "0.1.0" }
shell-diagnostics = { path = "../shell-diagnostics", version = "0.1.0" }
shell-renderer = { path = "../shell-renderer", version = "0.1.0" }
thiserror.workspace = true
quick-xml = "0.41"
win-nightlight-lib = { git = "https://github.com/kvnxiao/win-nightlight-cli", rev = "c416fe0411cb73bbc9c1aa141ba5cf97eec7fff6" }
windows = { version = "0.62.2", features = ["ApplicationModel", "Devices_Radios", "Foundation", "Management_Deployment", "Media_Control", "Storage_Search", "Storage_Streams", "Win32_Devices_Bluetooth", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.6.1"
windows-result = "0.4.1"

[lints]
workspace = true
