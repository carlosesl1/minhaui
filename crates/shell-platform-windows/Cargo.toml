[package]
name = "shell-platform-windows"
autotests = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
native-validation = []
# Unsupported Explorer internals are kept only for isolated research builds.
# Stable builds use documented, read-only notification registrations instead.
experimental-tray-bridge = []
# Explorer replacement is disabled in release builds until the watchdog owns
# crash-safe restoration. The feature exists for controlled validation only.
experimental-taskbar-replacement = []

[dependencies]
shell-config = { path = "../shell-config", version = "0.1.0" }
shell-core = { path = "../shell-core", version = "0.1.0" }
shell-diagnostics = { path = "../shell-diagnostics", version = "0.1.0" }
shell-renderer = { path = "../shell-renderer", version = "0.1.0" }
thiserror.workspace = true
quick-xml = "0.41"
windows = { version = "0.62.2", features = ["ApplicationModel", "Devices_Radios", "Foundation", "Management_Deployment", "Media_Control", "Storage_Search", "Storage_Streams", "Win32_Devices_Bluetooth", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
windows-registry = "0.6.1"

[build-dependencies]
cc = "1.3"

[lints]
workspace = true
