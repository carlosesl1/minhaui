[package]
name = "shell-platform-windows"
autotests = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
native-validation = []

[dependencies]
shell-config = { path = "../shell-config", version = "0.1.0" }
shell-core = { path = "../shell-core", version = "0.1.0" }
shell-diagnostics = { path = "../shell-diagnostics", version = "0.1.0" }
shell-renderer = { path = "../shell-renderer", version = "0.1.0" }
