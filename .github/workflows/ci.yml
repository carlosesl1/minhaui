name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_native_validation:
        description: Run tests that require the controlled Windows desktop image
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check architecture policy
        run: powershell -NoProfile -File scripts/Check-Architecture.ps1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run hermetic tests, including Windows process contracts
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --workspace --release
      - name: Validate package lifecycle recovery hooks
        run: powershell -NoProfile -File packaging/tests/PackagingLifecycle.Tests.ps1
      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit vulnerabilities
        run: cargo audit
      - name: Check dependencies and licenses
        run: cargo deny check advisories bans licenses sources

  native-windows-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_validation }}
    runs-on: [self-hosted, windows, x64, obsidian-native-validation]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Validate installed package and shell integration
        run: cargo test -p shell-platform-windows --features native-validation --lib
      - name: Validate native AppBar and lifecycle recovery
        run: cargo test -p shell-app --features native-validation --test showcase_startup
      - name: Build native validation shell
        run: cargo build -p shell-app --features native-validation
      - name: Validate instance activation and Settings UI Automation
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/Invoke-NativeWindowsValidation.ps1
          -ShellAppPath target/debug/shell-app.exe
      - name: Upload native validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-validation-${{ github.run_id }}
          path: artifacts/native-windows-validation/
          if-no-files-found: warn
          retention-days: 14
